version: '3.8'

services:
  apikeymanager:
    build: .
    image: apikeymanager:latest
    container_name: apikeymanager
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - APIKEYMGR_DATA_FILE=/app/data/api_keys.json
      - APIKEYMGR_HOST=0.0.0.0
      - APIKEYMGR_PORT=8000
      - APIKEYMGR_MAX_RETRIES=3
      - APIKEYMGR_REQUEST_TIMEOUT=120
      - APIKEYMGR_STREAMING_TIMEOUT=600
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s